apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "nova-scanner.fullname" . }}
  labels:
    {{- include "nova-scanner.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: {{ .Values.cronjob.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.cronjob.backoffLimit }}
      {{- if .Values.cronjob.ttlSecondsAfterFinished }}
      ttlSecondsAfterFinished: {{ .Values.cronjob.ttlSecondsAfterFinished }}
      {{- end }}
      template:
        metadata:
          labels:
            {{- include "nova-scanner.selectorLabels" . | nindent 12 }}
          {{- with .Values.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "nova-scanner.serviceAccountName" . }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          restartPolicy: OnFailure
          containers:
            - name: {{ .Chart.Name }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              image: {{ include "nova-scanner.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              args:
                - --config=/config/config.yaml
              envFrom:
                - secretRef:
                    name: {{ include "nova-scanner.secretName" . }}
              {{- if .Values.registryAuth.existingSecret }}
              env:
                - name: DOCKER_CONFIG
                  value: /docker-config
              {{- end }}
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                {{- if .Values.registryAuth.existingSecret }}
                - name: registry-auth
                  mountPath: /docker-config
                  readOnly: true
                {{- end }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
          volumes:
            - name: config
              configMap:
                name: {{ include "nova-scanner.fullname" . }}-config
            {{- if .Values.registryAuth.existingSecret }}
            - name: registry-auth
              secret:
                secretName: {{ .Values.registryAuth.existingSecret }}
                items:
                  - key: .dockerconfigjson
                    path: config.json
            {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
